blueprint:
  name: Time to TV
  description: |
    Display the current time on Android TV using HA TV Dashboard notification.
    Blueprint version 1.0.0
  domain: script
  author: nodinosaur / George
  source_url: https://github.com/nodinosaur/ha_tv_dashboard_blueprints/blob/main/time_to_tv.yaml
  homeassistant:
    min_version: "2024.6.0"

  input:
    notify_service:
      name: Notification Service
      description: >
        Enter the notify service (auto-complete works).
        Example: notify.mobile_app_lounge_tv
      default: notify.notify
      selector:
        text: {}

    time_config:
      name: Time Configuration
      icon: mdi:clock-outline
      collapsed: true
      input:
        time_entity:
          name: Time Entity
          description: |
            Sensor entity that provides the current time.
            Default is the built-in sensor.time entity.
          default: sensor.time
          selector:
            entity:
              domain: sensor

        title:
          name: Title
          description: |
            Title displayed on the time notification.
          default: "Time"
          selector:
            text: {}

variables:
  notify_service: !input notify_service
  time_entity: !input time_entity
  title: !input title

sequence:
  - action: !input notify_service
    data:
      title: "{{ title }}"
      message: ""
      data:
        notif_type: time
        time:
          local: "{{ states(time_entity) }}"
