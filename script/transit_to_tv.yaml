blueprint:
  name: Transit Status to TV
  description: |
    Display transit line status on Android TV using HA TV Dashboard notification.
    Configure which lines to display with custom labels, colors, and status sensors.
    Requires (HA TV Dashboard)[https://play.google.com/store/apps/details?id=io.homeassistant.companion.androidtv] 2026.2.1 (139) or newer.
    Blueprint version 1.0.0
  domain: script
  author: nodinosaur / George
  source_url: https://github.com/nodinosaur/ha_tv_dashboard_blueprints/blob/main/script/transit_to_tv.yaml
  homeassistant:
    min_version: "2024.6.0"

  input:
    notify_service:
      name: Notification Service
      description: >
        Enter the notify service (auto-complete works).
        Example: notify.mobile_app_lounge_tv
      default: notify.notify
      selector:
        text: {}

    title:
      name: Title
      description: |
        Title displayed on the transit notification.
      default: "Transit Status"
      selector:
        text: {}

    group_config:
      name: Group Header
      icon: mdi:transit-connection-variant
      collapsed: true
      input:
        group_label:
          name: Group Label
          description: |
            Label for the group header (e.g., "All other lines").
          default: "All other lines"
          selector:
            text: {}

        group_hex_color:
          name: Group Color
          description: |
            Hex color for the group header.
          default: "#0618A1"
          selector:
            text: {}

        group_status:
          name: Group Status
          description: |
            Default status text for the group header.
          default: "Good Service"
          selector:
            text: {}

    # Line 1
    line_1:
      name: Line 1
      icon: mdi:subway-variant
      collapsed: true
      input:
        line_1_enabled:
          name: Enable Line 1
          default: false
          selector:
            boolean: {}
        line_1_label:
          name: Label
          default: "Line 1"
          selector:
            text: {}
        line_1_hex_color:
          name: Hex Color
          default: "#888888"
          selector:
            text: {}
        line_1_status_entity:
          name: Status Entity
          description: |
            Sensor entity for line status.
          default: ""
          selector:
            entity:
              domain: sensor

    # Line 2
