sequence:
  # Validation: Ensure at least one line is enabled
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ not (line_1_enabled or line_2_enabled or line_3_enabled or
                      line_4_enabled or line_5_enabled or line_6_enabled or
                      line_7_enabled or line_8_enabled or line_9_enabled or
                      line_10_enabled or line_11_enabled or line_12_enabled or
                      line_13_enabled or line_14_enabled or line_15_enabled or
                      line_16_enabled or line_17_enabled or line_18_enabled) }}
        sequence:
          - stop: "Please enable at least one transit line."

  - action: !input notify_service
    data:
      title: "{{ title }}"
      message: ""
      data:
        notif_type: transit
        transit:
          group:
            label: "{{ group_label }}"
            hex_color: "{{ group_hex_color }}"
            status: "{{ group_status }}"
          status: >-
            {% set lines = namespace(list=[]) %}
            {% if line_1_enabled and line_1_status_entity %}
              {% set lines.list = lines.list + [{'label': line_1_label, 'hex_color': line_1_hex_color, 'status': state_translated(line_1_status_entity)}] %}
            {% endif %}
            {% if line_2_enabled and line_2_status_entity %}
              {% set lines.list = lines.list + [{'label': line_2_label, 'hex_color': line_2_hex_color, 'status': state_translated(line_2_status_entity)}] %}
            {% endif %}
            {% if line_3_enabled and line_3_status_entity %}
              {% set lines.list = lines.list + [{'label': line_3_label, 'hex_color': line_3_hex_color, 'status': state_translated(line_3_status_entity)}] %}
            {% endif %}
            {% if line_4_enabled and line_4_status_entity %}
              {% set lines.list = lines.list + [{'label': line_4_label, 'hex_color': line_4_hex_color, 'status': state_translated(line_4_status_entity)}] %}
            {% endif %}
            {% if line_5_enabled and line_5_status_entity %}
              {% set lines.list = lines.list + [{'label': line_5_label, 'hex_color': line_5_hex_color, 'status': state_translated(line_5_status_entity)}] %}
            {% endif %}
            {% if line_6_enabled and line_6_status_entity %}
              {% set lines.list = lines.list + [{'label': line_6_label, 'hex_color': line_6_hex_color, 'status': state_translated(line_6_status_entity)}] %}
            {% endif %}
            {% if line_7_enabled and line_7_status_entity %}
              {% set lines.list = lines.list + [{'label': line_7_label, 'hex_color': line_7_hex_color, 'status': state_translated(line_7_status_entity)}] %}
            {% endif %}
            {% if line_8_enabled and line_8_status_entity %}
              {% set lines.list = lines.list + [{'label': line_8_label, 'hex_color': line_8_hex_color, 'status': state_translated(line_8_status_entity)}] %}
            {% endif %}
            {% if line_9_enabled and line_9_status_entity %}
              {% set lines.list = lines.list + [{'label': line_9_label, 'hex_color': line_9_hex_color, 'status': state_translated(line_9_status_entity)}] %}
            {% endif %}
            {% if line_10_enabled and line_10_status_entity %}
              {% set lines.list = lines.list + [{'label': line_10_label, 'hex_color': line_10_hex_color, 'status': state_translated(line_10_status_entity)}] %}
            {% endif %}
            {% if line_11_enabled and line_11_status_entity %}
              {% set lines.list = lines.list + [{'label': line_11_label, 'hex_color': line_11_hex_color, 'status': state_translated(line_11_status_entity)}] %}
            {% endif %}
            {% if line_12_enabled and line_12_status_entity %}
              {% set lines.list = lines.list + [{'label': line_12_label, 'hex_color': line_12_hex_color, 'status': state_translated(line_12_status_entity)}] %}
            {% endif %}
            {% if line_13_enabled and line_13_status_entity %}
              {% set lines.list = lines.list + [{'label': line_13_label, 'hex_color': line_13_hex_color, 'status': state_translated(line_13_status_entity)}] %}
            {% endif %}
            {% if line_14_enabled and line_14_status_entity %}
              {% set lines.list = lines.list + [{'label': line_14_label, 'hex_color': line_14_hex_color, 'status': state_translated(line_14_status_entity)}] %}
            {% endif %}
            {% if line_15_enabled and line_15_status_entity %}
              {% set lines.list = lines.list + [{'label': line_15_label, 'hex_color': line_15_hex_color, 'status': state_translated(line_15_status_entity)}] %}
            {% endif %}
            {% if line_16_enabled and line_16_status_entity %}
              {% set lines.list = lines.list + [{'label': line_16_label, 'hex_color': line_16_hex_color, 'status': state_translated(line_16_status_entity)}] %}
            {% endif %}
            {% if line_17_enabled and line_17_status_entity %}
              {% set lines.list = lines.list + [{'label': line_17_label, 'hex_color': line_17_hex_color, 'status': state_translated(line_17_status_entity)}] %}
            {% endif %}
            {% if line_18_enabled and line_18_status_entity %}
